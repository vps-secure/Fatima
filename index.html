<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RUSSIAN ROULETTE - DOMINO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#fff;font-family:Arial;text-align:center;height:100vh;display:flex;flex-direction:column;justify-content:center;padding:15px}
h1{font-size:28px;color:#e60000}
p{color:#aaa;margin:10px 0 20px;font-size:14px}
#board{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:380px;margin:0 auto;width:100%}
.domino{background:#1a1a1a;border:2px solid #333;border-radius:12px;height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.domino.opened{background:#fff;color:#000}
.domino.bullet{background:#e60000 !important}
#msg{font-size:22px;font-weight:bold;margin-top:20px;min-height:30px}
#reset{margin-top:10px;background:#e60000;color:#fff;border:none;padding:12px 30px;border-radius:30px;font-size:16px;display:none}
</style>
</head>
<body>
<h1>RUSSIAN ROULETTE</h1>
<p id="hint">HOLD a domino, then LIFT your finger to reveal it</p>
<div id="board"></div>
<div id="msg"></div>
<button id="reset" onclick="location.reload()">PLAY AGAIN</button>
<script>
const board=document.getElementById('board');
const msg=document.getElementById('msg');
const hint=document.getElementById('hint');
let bullet=Math.floor(Math.random()*6);
let opened=0; let gameOver=false;
let vals=[[6,6],[5,3],[4,4],[2,6],[1,5],[3,2]];
vals.sort(()=>Math.random()-0.5);
for(let i=0;i<6;i++){
let d=document.createElement('div'); d.className='domino';
d.innerHTML='<div style="font-size:32px">• •<br>• •</div><div style="font-size:11px;color:#777">HOLD + LIFT</div>';
let holding=false;
d.addEventListener('touchstart',e=>{e.preventDefault(); if(gameOver||d.classList.contains('opened'))return; holding=true; d.style.borderColor='#ffcc00'; hint.textContent='NOW LIFT YOUR FINGER...';});
d.addEventListener('touchend',e=>{e.preventDefault(); if(!holding)return; holding=false; reveal(d,i);});
d.addEventListener('mousedown',()=>{if(gameOver||d.classList.contains('opened'))return; holding=true;});
d.addEventListener('mouseup',()=>{if(!holding)return; holding=false; reveal(d,i);});
board.appendChild(d);
}
function reveal(d,i){
if(gameOver||d.classList.contains('opened'))return;
d.classList.add('opened');
let v=vals[i];
d.innerHTML='<div style="font-size:24px">'+'• '.repeat(v[0])+'<hr style="width:50px;margin:8px auto">'+'• '.repeat(v[1])+'</div><div>DOMINO '+v[0]+' | '+v[1]+'</div
