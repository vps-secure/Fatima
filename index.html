<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MATRYOSHKA</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#fff5f0;font-family:Arial;text-align:center;height:100vh;display:flex;flex-direction:column;overflow:hidden}
h1{font-size:24px;letter-spacing:4px;color:#8b0000;margin-top:12px}
p{color:#888;font-size:13px}
#stage{flex:1;display:flex;align-items:flex-end;justify-content:center}
.doll-row{display:flex;align-items:flex-end;gap:4px}
.doll-img{transition:.4s;filter:drop-shadow(0 10px 15px rgba(0,0,0,.3))}
.doll-img.dim{opacity:.25;filter:grayscale(1)}
#hint{font-size:17px;font-weight:bold;color:#8b0000;margin:8px}
#count{color:#999;font-size:13px;margin-bottom:10px}
#final{position:fixed;top:0;left:0;width:100%;height:100%;background:#8b0000;color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;padding:30px;z-index:99}
#final h2{font-size:30px;line-height:1.3}
#final p{color:#ffcccc;font-size:17px;margin-top:15px;line-height:1.5}
#final button{margin-top:25px;background:#fff;color:#8b0000;border:none;padding:13px 35px;border-radius:30px;font-size:16px;font-weight:bold}
</style>
</head>
<body>
<h1>MATRYOSHKA</h1>
<p>Russian Nesting Dolls</p>
<div id="stage"><div class="doll-row" id="row"></div></div>
<div id="hint">SWIPE UP on the BIG doll to open it</div>
<div id="count">Doll 1 of 7 - Swipe Up</div>
<div id="final">
<h2>YOU ARE MY LAST DOLL,<br>MY FOREVER LOVE.</h2>
<p>Like these dolls, inside my heart<br>there is only you, Fatima.<br>7 dolls, 1 heart, and it's yours.</p>
<button onclick="location.reload()">PLAY AGAIN</button>
</div>
<script>
let img="https://upload.wikimedia.org/wikipedia/commons/thumb/3/36/Matryoshka_dolls.jpg/800px-Matryoshka_dolls.jpg";
let row=document.getElementById('row');
let hint=document.getElementById('hint');
let count=document.getElementById('count');
let current=0;
for(let i=0;i<7;i++){
let im=document.createElement('img'); im.src=img; im.className='doll-img';
let w=[110,95,80,65,52,40,30][i];
im.style.width=w+'px'; im.style.height=(w*1.4)+'px'; im.style.objectFit='cover';
if(i>0) im.classList.add('dim');
row.appendChild(im);
}
function openNext(){
if(current>=6){
document.getElementById('final').style.display='flex';
return;
}
let imgs=row.querySelectorAll('.doll-img');
imgs[current].style.transform='translateY(-100px) scale(0)'; imgs[current].style.opacity='0';
setTimeout(()=>{
imgs[current].style.display='none'; current++;
if(current<7){
imgs[current].classList.remove('dim');
count.textContent='Doll '+(current+1)+' of 7 - Swipe Up';
hint.textContent='One more inside! Swipe UP again!';
if(current===6) hint.textContent='Last one! Swipe UP for the message!';
} else {
document.getElementById('final').style.display='flex';
}
},300);
if(current===6){
setTimeout(()=>{document.getElementById('final').style.display='flex';},400);
}
}
let startY=0;
document.addEventListener('touchstart',e=>{startY=e.touches[0].clientY},{passive:true});
document.addEventListener('touchend',e=>{if(startY-e.changedTouches[0].clientY>60) openNext();},{passive:true});
document.addEventListener('mousedown',e=>{startY=e.clientY});
document.addEventListener('mouseup',e=>{if(startY-e.clientY>60) openNext();});
</script>
</body>
</html>
